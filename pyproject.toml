[project]
name = "prometheon-forge"
version = "0.1.0"
description = "Organization-aware domain foundation and default-deny HTTP transport"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# A real SMTP server for the delivery tests (STARTTLS, implicit TLS, AUTH); pinned with its two dependencies.
test = [
    "aiosmtpd==1.4.6",
    "atpublic==8.0.1",
    "attrs==26.1.0",
]

# Tests use standard-library unittest; httpx powers the in-process HTTP client.

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
forge = ["web/status.html", "web/status.css", "web/status.js", "web/admin/**/*", "capability_seed.jsonl"]
