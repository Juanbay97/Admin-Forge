[project]
name = "prometheon-forge"
version = "0.1.0"
description = "Organization-aware domain foundation and default-deny HTTP transport"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "PyJWT[crypto]==2.15.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

# Tests use standard-library unittest; httpx powers the in-process HTTP client.
