# Prometheon Forge production stack: PostgreSQL 17, one-shot migrations, the control plane and Caddy.
#
#   cp .env.example .env && ../scripts/deploy-secrets.sh && docker compose up -d --build --wait
#
# Start order (each step waits for the previous one): postgres healthy -> migrate completed -> control-plane
# healthy -> caddy. A failed migrate stops everything after it. Only caddy publishes host ports. See docs/deploy.md.
name: forge

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# Everything the runtime reads. FORGE_DOMAIN itself stays out: the runtime only knows the public origin.
x-forge-env: &forge-env
  FORGE_PUBLIC_ORIGIN: https://${FORGE_DOMAIN:?set FORGE_DOMAIN in deploy/.env}${FORGE_PORT_SUFFIX:-}
  FORGE_DB_HOST: postgres
  FORGE_DB_NAME: forge
  FORGE_DB_SSLMODE: disable  # private, internal-only compose network; PostgreSQL is never published
  FORGE_DB_ADMIN_USER: postgres
  FORGE_ROLE_PASSWORDS_DIR: /run/secrets
  FORGE_DELIVERY_KEY_FILE: /run/secrets/delivery_key
  FORGE_GATEWAY_KEY_FILE: /run/secrets/gateway_key
  FORGE_GATEWAY_ORIGINS: ${FORGE_GATEWAY_ORIGINS:-}
  FORGE_LOG_LEVEL: ${FORGE_LOG_LEVEL:-INFO}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652}
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets:
      - pg_superuser
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    cap_drop:
      - ALL
    cap_add:  # only what the entrypoint needs to chown the data directory and drop to the postgres user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # TCP on purpose: during first-time initialisation the server listens on the Unix socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d forge"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging: *logging

  migrate:
    image: ${FORGE_IMAGE:-forge-control-plane:local}
    command: ["migrate", "--migrations-dir", "/app/migrations"]
    restart: "no"
    environment:
      <<: *forge-env
      FORGE_DB_ADMIN_PASSWORD_FILE: /run/secrets/pg_superuser
    secrets:
      - pg_superuser
      - forge_account_service
      - forge_enrollment
      - forge_runtime
      - forge_gateway_service
      - forge_branding_service
      - delivery_key
      - gateway_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  control-plane:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${FORGE_IMAGE:-forge-control-plane:local}
    command: ["serve"]
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    environment: *forge-env
    secrets:  # no database administrator secret: the serving process never holds DDL rights
      - forge_account_service
      - forge_enrollment
      - forge_runtime
      - forge_gateway_service
      - forge_branding_service
      - delivery_key
      - gateway_key
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "forge.serve_prod", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging

  caddy:
    image: caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      FORGE_DOMAIN: ${FORGE_DOMAIN:?set FORGE_DOMAIN in deploy/.env}
      FORGE_TLS: ${FORGE_TLS:-acme}  # acme | internal; anything else makes Caddy refuse to start
      FORGE_ACME_EMAIL: ${FORGE_ACME_EMAIL:-}
    ports:
      - "${FORGE_PUBLISH_ADDRESS:-0.0.0.0}:${FORGE_HTTP_PORT:-80}:80"
      - "${FORGE_PUBLISH_ADDRESS:-0.0.0.0}:${FORGE_HTTPS_PORT:-443}:443"
      - "${FORGE_PUBLISH_ADDRESS:-0.0.0.0}:${FORGE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FORGE_DOWNLOADS_DIR:-./downloads}:/srv/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging: *logging

  # Operator tool, never started by `up`. It joins the database's network namespace because the trusted
  # provisioning CLI only connects to 127.0.0.1. Temporary until the platform administration lands.
  #   FORGE_UID=$(id -u) FORGE_GID=$(id -g) docker compose --profile tools run --rm provision org --slug ... 
  provision:
    image: ${FORGE_IMAGE:-forge-control-plane:local}
    profiles:
      - tools
    entrypoint: ["/bin/sh", "/opt/forge/provision.sh"]
    network_mode: service:postgres
    user: "${FORGE_UID:-10001}:${FORGE_GID:-10001}"
    secrets:
      - pg_superuser
    volumes:
      - ./tools/provision.sh:/opt/forge/provision.sh:ro
      - ${FORGE_CREDENTIALS_DIR:-./credentials}:/credentials
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  edge: {}
  data:
    internal: true  # no route out: PostgreSQL can neither be reached from the internet nor reach it

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# Secret files live in deploy/secrets (generated by scripts/deploy-secrets.*, never committed).
# The service-role secrets keep the role name so the runtime reads them as a directory (FORGE_ROLE_PASSWORDS_DIR).
secrets:
  pg_superuser:
    file: ${FORGE_SECRETS_DIR:-./secrets}/pg_superuser
  forge_account_service:
    file: ${FORGE_SECRETS_DIR:-./secrets}/role_forge_account_service
  forge_enrollment:
    file: ${FORGE_SECRETS_DIR:-./secrets}/role_forge_enrollment
  forge_runtime:
    file: ${FORGE_SECRETS_DIR:-./secrets}/role_forge_runtime
  forge_gateway_service:
    file: ${FORGE_SECRETS_DIR:-./secrets}/role_forge_gateway_service
  forge_branding_service:
    file: ${FORGE_SECRETS_DIR:-./secrets}/role_forge_branding_service
  forge_backup:
    file: ${FORGE_SECRETS_DIR:-./secrets}/role_backup
  delivery_key:
    file: ${FORGE_SECRETS_DIR:-./secrets}/delivery_key
  gateway_key:
    file: ${FORGE_SECRETS_DIR:-./secrets}/gateway_key
