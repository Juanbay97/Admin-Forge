# Local proof overlay: the same stack, bound to loopback on alternate ports with Caddy's internal CA.
#
#   docker compose -f compose.yml -f compose.dev.yml --env-file .env.dev up -d --build --wait
#
# Needs Docker Compose 2.24+ (`!override`). The matching .env.dev sets FORGE_DOMAIN=localhost and
# FORGE_PORT_SUFFIX=:8443 so the public origin is https://localhost:8443 (scripts/deploy-smoke.ps1 does exactly this).
services:
  # Catches every outgoing message (FORGE_SMTP_SECURITY=none, no credentials) so the proof can read the invitation
  # email and open its link. Messages stay in memory; web UI and API on loopback only.
  mailpit:
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORGE_MAILPIT_PORT:-8025}:8025"
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # A fake OpenAI-compatible gateway over https with a throwaway certificate, so the proof can meter real inference end to end:
  # the production allow-list refuses plain http, and the control plane trusts exactly this certificate through
  # FORGE_GATEWAY_CA_FILE (below). Never published on the host, never part of the production stack.
  # One-time setup (scripts/deploy-smoke.ps1 does this in a temp directory):
  #   python -m forge.fake_gateway --make-cert DIR --name fake-gateway     # writes DIR/gateway.crt and DIR/gateway.key
  #   one accepted key per line in DIR/keys.txt, then FORGE_FAKE_GATEWAY_DIR=DIR and FORGE_GATEWAY_ORIGINS=https://fake-gateway:3413
  fake-gateway:
    image: ${FORGE_IMAGE:-forge-control-plane:local}
    entrypoint: ["python", "-m", "forge.fake_gateway"]
    command: ["--keys-file", "/fake/keys.txt", "--tls-cert", "/fake/gateway.crt", "--tls-key", "/fake/gateway.key", "--bind-all"]
    restart: unless-stopped
    volumes:
      - ${FORGE_FAKE_GATEWAY_DIR:?set FORGE_FAKE_GATEWAY_DIR in deploy/.env.dev (see compose.dev.yml)}:/fake:ro
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3413), 3).close()"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # A fake OAuth 2.0 provider (3414) and MCP server (3415) over plain http for the connector broker proof. Never published, never part of
  # the production stack: the control plane reaches them only through the explicit egress fixtures file below (the production egress
  # guard refuses http, loopback and private addresses). scripts/deploy-smoke.ps1 writes fixtures.json into FORGE_FAKE_CONNECTORS_DIR.
  fake-connectors:
    image: ${FORGE_IMAGE:-forge-control-plane:local}
    entrypoint: ["python", "-m", "forge.fake_connectors"]
    command: ["serve", "--bind", "0.0.0.0", "--oauth-port", "3414", "--mcp-port", "3415"]
    restart: unless-stopped
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3414), 3).close()"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  control-plane:
    environment:
      FORGE_GATEWAY_CA_FILE: /run/fake-gateway/gateway.crt
      FORGE_CONNECTOR_TEST_FIXTURES_FILE: /run/fake-connectors/fixtures.json
    volumes:
      - ${FORGE_FAKE_GATEWAY_DIR:?set FORGE_FAKE_GATEWAY_DIR in deploy/.env.dev}/gateway.crt:/run/fake-gateway/gateway.crt:ro
      - ${FORGE_FAKE_CONNECTORS_DIR:?set FORGE_FAKE_CONNECTORS_DIR in deploy/.env.dev}/fixtures.json:/run/fake-connectors/fixtures.json:ro
    depends_on:
      fake-gateway:
        condition: service_healthy
      fake-connectors:
        condition: service_healthy

  caddy:
    environment:
      FORGE_TLS: ${FORGE_TLS:-internal}
    ports: !override
      - "127.0.0.1:${FORGE_HTTP_PORT:-8080}:80"
      - "127.0.0.1:${FORGE_HTTPS_PORT:-8443}:443"
      - "127.0.0.1:${FORGE_HTTPS_PORT:-8443}:443/udp"
